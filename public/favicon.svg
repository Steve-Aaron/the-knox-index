<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="256" height="256" href="data:image/png;base64,"/>
  <image class="dark" width="256" height="256" href="data:image/png;base64,"/>
</svg>
